<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#05070a">
<meta http-equiv="refresh" content="5;url=https://www.img.com/">
<title>IMG — System Down</title>
<link rel="icon" type="image/png" href="/img-logo-hq.png">
<link rel="shortcut icon" type="image/png" href="/img-logo-hq.png">
<link rel="apple-touch-icon" href="/img-logo-hq.png">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#05070a;color:#f4f6f8;font-family:Inter,Arial,Helvetica,sans-serif}
body{min-height:100svh;display:grid;place-items:center;overflow:hidden;position:relative}
body::before{content:"";position:fixed;inset:-20%;background:
radial-gradient(circle at 50% 15%,rgba(255,255,255,.08),transparent 30%),
radial-gradient(circle at 50% 85%,rgba(239,63,69,.12),transparent 34%);
pointer-events:none}
.wrap{width:min(920px,calc(100% - 40px));text-align:center;position:relative;z-index:1;padding:48px 18px}
.logo{width:118px;max-width:32vw;height:auto;margin:0 auto 48px;filter:drop-shadow(0 12px 34px rgba(0,0,0,.45))}
.status{display:inline-flex;align-items:center;gap:10px;padding:9px 14px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(255,255,255,.04);font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#b8c0cb}
.dot{width:8px;height:8px;border-radius:50%;background:#ef3f45;box-shadow:0 0 0 0 rgba(239,63,69,.45);animation:pulse 1.8s infinite}
h1{margin:28px auto 20px;font-size:clamp(3.2rem,11vw,8.5rem);line-height:.84;letter-spacing:-.055em;text-transform:uppercase;font-weight:900;max-width:900px}
h1 span{display:block;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.68)}
p{max-width:620px;margin:0 auto;color:#aeb7c2;font-size:clamp(1rem,2.4vw,1.18rem);line-height:1.75}
.small{margin-top:28px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:#727c89}
.line{width:72px;height:2px;background:#ef3f45;margin:34px auto}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,63,69,.45)}70%{box-shadow:0 0 0 12px rgba(239,63,69,0)}100%{box-shadow:0 0 0 0 rgba(239,63,69,0)}}
@media(max-width:640px){.wrap{padding:36px 12px}.logo{margin-bottom:36px;width:96px}.small{font-size:.68rem}}
</style>
</head>
<body>
<main class="wrap">
  <img class="logo" src="/img-logo-soccer.svg" alt="IMG">
  <div class="status"><span class="dot" aria-hidden="true"></span>System unavailable</div>
  <h1>IMG system<span>is down</span></h1>
  <div class="line" aria-hidden="true"></div>
  <p>IMG is temporarily unavailable while we work on the system. Scores, news, league data and other services may be inaccessible during this period.</p>
  <p class="small">Please check back shortly.</p>
</main>
<script>setTimeout(function(){window.location.replace("https://www.img.com/");},5000);</script>
</body>
</html>
