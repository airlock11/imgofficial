name: Rebuild approved UAAP hero

on:
  push:
    branches: [uaap-hero-upload-v9]
    paths:
      - "tmp/uaap-v9.part*"
      - ".github/workflows/rebuild-approved-uaap-v9.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-approved-uaap-v9
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: uaap-hero-upload-v9

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Rebuild exact approved hero
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/uaap
          cat             tmp/uaap-v9.part00             tmp/uaap-v9.part01             tmp/uaap-v9.part02             tmp/uaap-v9.part03             tmp/uaap-v9.part04             tmp/uaap-v9.part05             tmp/uaap-v9.part06             tmp/uaap-v9.part07             tmp/uaap-v9.part08             tmp/uaap-v9.part09             | tr -d '\n\r\t '             | base64 --decode > assets/uaap/uaap-hero-approved-v9.webp

      - name: Validate exact bytes and dimensions
        shell: bash
        run: |
          set -euo pipefail
          echo "23decd5ea795d33f8e4b286ab53b5df1e7dcddcc55c04690ace25080e1f359f2  assets/uaap/uaap-hero-approved-v9.webp" | sha256sum -c -
          test "$(stat -c '%s' assets/uaap/uaap-hero-approved-v9.webp)" = "385478"
          python - <<'PY'
          from PIL import Image
          p="assets/uaap/uaap-hero-approved-v9.webp"
          im=Image.open(p)
          assert im.size == (2560,1440), im.size
          assert im.format == "WEBP", im.format
          im.verify()
          print("validated exact approved UAAP hero:", (2560,1440), "WEBP")
          PY

      - name: Publish approved hero on safe branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/uaap/uaap-hero-approved-v9.webp
          git rm -f tmp/uaap-v9.part00 tmp/uaap-v9.part01 tmp/uaap-v9.part02 tmp/uaap-v9.part03 tmp/uaap-v9.part04 tmp/uaap-v9.part05 tmp/uaap-v9.part06 tmp/uaap-v9.part07 tmp/uaap-v9.part08 tmp/uaap-v9.part09
          git rm -f .github/workflows/rebuild-approved-uaap-v9.yml
          git commit -m "Add exact approved UAAP hero asset"
          git push origin HEAD:uaap-hero-upload-v9
