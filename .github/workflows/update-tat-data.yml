name: Update TAT data

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_tat_data.py"
      - ".github/workflows/update-tat-data.yml"
      - "tat-assets.json"
      - "tat-official.json"

permissions:
  contents: write

concurrency:
  group: tat-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore automated TAT media cache
        shell: bash
        run: |
          git fetch origin tat-data || true
          if git rev-parse --verify origin/tat-data >/dev/null 2>&1; then
            git checkout origin/tat-data -- assets/tat/news assets/tat/highlights 2>/dev/null || true
          fi

      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Refresh TAT schedules, results, teams, news, stats and videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_tat_data.py

      - name: Validate TAT data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("tat-official.json")
          j=json.loads(p.read_text())
          assert isinstance(j.get("games"), list)
          assert isinstance(j.get("teams"), list)
          assert isinstance(j.get("headlines"), list)
          assert isinstance(j.get("highlights"), list)
          print("Validated", len(j["games"]), "games", len(j["teams"]), "teams")
          PY

      - name: Publish TAT data branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG TAT Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tat-official.json assets/tat/news assets/tat/highlights
          if git diff --cached --quiet; then
            echo "TAT sources checked; no data changes."
            exit 0
          fi
          git commit -m "Update automated TAT data"
          git push --force origin HEAD:tat-data
