name: Update TAT data

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_tat_data.py"
      - "scripts/tat_automation_gate.py"
      - ".github/workflows/update-tat-data.yml"
      - "tat-assets.json"
      - "tat-official.json"

permissions:
  contents: write

concurrency:
  group: tat-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read latest TAT automation state
        shell: bash
        run: |
          git fetch origin tat-data || true
          if git rev-parse --verify origin/tat-data >/dev/null 2>&1; then
            git show origin/tat-data:tat-official.json > /tmp/tat-current.json 2>/dev/null || cp tat-official.json /tmp/tat-current.json
            git checkout origin/tat-data -- assets/tat/news assets/tat/highlights 2>/dev/null || true
          else
            cp tat-official.json /tmp/tat-current.json
          fi

      - name: Decide TAT automation mode
        id: gate
        shell: bash
        run: |
          python3 scripts/tat_automation_gate.py --data /tmp/tat-current.json --event "${{ github.event_name }}" | tee /tmp/tat-gate.txt
          cat /tmp/tat-gate.txt >> "$GITHUB_OUTPUT"

      - name: Show TAT automation plan
        shell: bash
        run: |
          echo "mode=${{ steps.gate.outputs.mode }}"
          echo "game_day=${{ steps.gate.outputs.game_day }}"
          echo "today_game_count=${{ steps.gate.outputs.today_game_count }}"
          echo "run_update=${{ steps.gate.outputs.run_update }}"
          echo "run_slow=${{ steps.gate.outputs.run_slow }}"
          echo "next_game_at=${{ steps.gate.outputs.next_game_at }}"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run_update == 'true'
        with:
          python-version: "3.12"

      - name: Install TAT updater dependencies
        if: steps.gate.outputs.run_update == 'true'
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Refresh TAT data
        if: steps.gate.outputs.run_update == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TAT_GAME_DAY: ${{ steps.gate.outputs.game_day }}
          TAT_RUN_SLOW: ${{ steps.gate.outputs.run_slow }}
          TAT_AUTOMATION_MODE: ${{ steps.gate.outputs.mode }}
          TAT_TODAY_GAME_COUNT: ${{ steps.gate.outputs.today_game_count }}
          TAT_NEXT_GAME_AT: ${{ steps.gate.outputs.next_game_at }}
        run: python scripts/update_tat_data.py

      - name: Idle day skip
        if: steps.gate.outputs.run_update != 'true'
        run: echo "No TAT game today and the slow discovery interval is not due; skipping heavy TAT automation."

      - name: Validate TAT data
        if: steps.gate.outputs.run_update == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("tat-official.json")
          j=json.loads(p.read_text())
          assert isinstance(j.get("games"), list)
          assert isinstance(j.get("teams"), list)
          assert isinstance(j.get("headlines"), list)
          assert isinstance(j.get("highlights"), list)
          auto=j.get("automation") or {}
          schedule=auto.get("scheduleAware") or {}
          assert schedule.get("mode") in {"idle","game-day"}
          print("Validated", len(j["games"]), "games", len(j["teams"]), "teams", "mode", schedule.get("mode"))
          PY

      - name: Publish TAT data branch
        if: steps.gate.outputs.run_update == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG TAT Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tat-official.json assets/tat/news assets/tat/highlights
          if git diff --cached --quiet; then
            echo "TAT sources checked; no data changes."
            exit 0
          fi
          git commit -m "Update automated TAT data"
          git push --force origin HEAD:tat-data
