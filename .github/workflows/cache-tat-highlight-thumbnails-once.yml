name: Cache TAT highlight thumbnails once

on:
  push:
    branches: [main]
    paths:
      - "scripts/cache_tat_highlight_thumbnails.py"
      - ".github/workflows/cache-tat-highlight-thumbnails-once.yml"

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Download distinct official TAT thumbnails
        run: python scripts/cache_tat_highlight_thumbnails.py
      - name: Commit thumbnails
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG TAT Assets"
          git config user.email "actions@users.noreply.github.com"
          git add assets/tat/highlights
          if git diff --cached --quiet; then
            echo "No thumbnail changes."
            exit 0
          fi
          git commit -m "Store distinct TAT highlight thumbnails"
          git pull --rebase origin main
          git push origin HEAD:main
