# automation-audit: 2026-09-22
name: Update multi-bookmaker odds data

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_odds.py"
      - ".github/workflows/update-odds.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh odds from OddsPapi and The Odds API
        run: python scripts/update_odds.py

      - name: Commit updated odds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG Odds Data Bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python scripts/update_odds.py

            if git diff --quiet -- odds-data.json odds-meta.json; then
              echo "No data changes."
              exit 0
            fi

            git add odds-data.json odds-meta.json
            git commit -m "Update multi-bookmaker odds data"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another automation; regenerating from latest main (attempt $attempt)."
          done

          echo "Unable to publish after retries."
          exit 1
