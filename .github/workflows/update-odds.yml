name: Update Bet365 odds data

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_odds.py"
      - ".github/workflows/update-odds.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh Bet365 odds from OddsPapi
        run: python scripts/update_odds.py

      - name: Commit updated odds
        shell: bash
        run: |
          if git diff --quiet -- odds-data.json odds-meta.json; then
            echo "No odds changes."
            exit 0
          fi
          git config user.name "IMG Odds Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add odds-data.json odds-meta.json
          git commit -m "Update Bet365 odds data"
          git push
