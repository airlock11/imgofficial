name: Update PBA highlight posters

on:
  push:
    branches: [main]
    paths:
      - "pba-official.json"
      - "scripts/update_pba_highlight_posters.py"
      - ".github/workflows/update-pba-highlight-posters.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  posters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check requests pillow

      - name: Download true vertical PBA Short posters
        id: posters
        continue-on-error: true
        run: python scripts/update_pba_highlight_posters.py

      - name: Commit posters
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG PBA Posters"
          git config user.email "actions@users.noreply.github.com"
          git add assets/pba/highlights
          if git diff --cached --quiet; then
            echo "No poster changes to commit."
          else
            git commit -m "Store HD vertical PBA highlight posters"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Require current posters
        if: steps.posters.outcome == 'failure'
        run: exit 1
