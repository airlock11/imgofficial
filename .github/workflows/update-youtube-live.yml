name: Update YouTube live streams
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_youtube_live.py"
      - "scripts/asian_live_expiry.py"
      - "live-stream-sources.json"
      - ".github/workflows/update-youtube-live.yml"
permissions:
  contents: write
concurrency:
  group: youtube-live-update
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh and publish YouTube live data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG Live Stream Bot"
          git config user.email "actions@users.noreply.github.com"

          # GitHub schedules this workflow every five minutes. Keep the job alive
          # and rescan once per minute so newly-ended streams disappear quickly.
          for scan in 1 2 3 4 5; do
            published=0
            echo "IMG livestream scan $scan/5"

            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main

              python scripts/update_youtube_live.py

              if git diff --quiet -- youtube-live.json; then
                echo "No semantic stream changes."
                published=1
                break
              fi

              git add youtube-live.json
              git commit -m "Update verified YouTube live streams"

              if git push origin HEAD:main; then
                published=1
                break
              fi

              echo "Push raced with another main update; regenerating from latest main (attempt $attempt)."
            done

            if [ "$published" -ne 1 ]; then
              echo "Unable to publish YouTube live data after retries."
              exit 1
            fi

            if [ "$scan" -lt 5 ]; then
              sleep 55
            fi
          done
