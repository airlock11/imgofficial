name: Update YouTube live streams
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: youtube-live-update
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover current YouTube live streams
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_youtube_live.py
      - name: Commit live stream data
        run: |
          if git diff --quiet -- youtube-live.json; then
            echo "No stream changes."
            exit 0
          fi
          git config user.name "IMG Live Stream Bot"
          git config user.email "actions@users.noreply.github.com"
          git add youtube-live.json
          git commit -m "Update verified YouTube live streams"
          git fetch origin main
          git rebase origin/main
          git push
