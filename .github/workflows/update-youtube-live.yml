# asian-games-stream-reset: 2026-09-23-1
# automation-audit: 2026-09-23
name: Update YouTube live streams
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_youtube_live.py"
      - "scripts/verify_youtube_live.py"
      - "scripts/validate_youtube_live.py"
      - "scripts/asian_live_expiry.py"
      - "live-stream-sources.json"
      - ".github/workflows/update-youtube-live.yml"
permissions:
  contents: write
concurrency:
  group: youtube-live-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Refresh and verify YouTube live data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG Live Stream Bot"
          git config user.email "actions@users.noreply.github.com"

          published=0
          for attempt in 1 2 3; do
            echo "YouTube refresh attempt $attempt/3"

            git fetch origin main live-data || git fetch origin main
            git reset --hard origin/main

            # Restore the latest livestream state from the dedicated data branch.
            # This keeps rapid live updates independent from normal site deploys.
            if git rev-parse --verify origin/live-data >/dev/null 2>&1; then
              git show origin/live-data:youtube-live.json > youtube-live.json || true
            fi

            if ! python scripts/update_youtube_live.py; then
              echo "Scanner failed; retrying."
              sleep $((attempt * 5))
              continue
            fi
            if ! python scripts/verify_youtube_live.py; then
              echo "Verifier failed; retrying."
              sleep $((attempt * 5))
              continue
            fi
            if ! python scripts/validate_youtube_live.py; then
              echo "Output validation failed; retrying without publishing."
              sleep $((attempt * 5))
              continue
            fi

            git add youtube-live.json
            if git diff --cached --quiet; then
              echo "No livestream publish needed."
              published=1
              break
            fi

            git commit -m "Update verified YouTube live streams"

            # Publish only to the dedicated live-data branch. The website reads
            # raw GitHub from this branch first, so live state no longer waits
            # for a GitHub Pages deployment or competes with other main pushes.
            if git push --force-with-lease origin HEAD:live-data; then
              published=1
              break
            fi
            echo "Live-data push raced; retrying."
            sleep $((attempt * 5))
          done

          if [ "$published" -ne 1 ]; then
            echo "Unable to publish YouTube verification after retries."
            exit 1
          fi
