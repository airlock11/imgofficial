# asian-games-stream-reset: 2026-09-22-1
# automation-audit: 2026-09-22
name: Update YouTube live streams
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_youtube_live.py"
      - "scripts/verify_youtube_live.py"
      - "scripts/validate_youtube_live.py"
      - "scripts/asian_live_expiry.py"
      - "live-stream-sources.json"
      - ".github/workflows/update-youtube-live.yml"
permissions:
  contents: write
concurrency:
  group: youtube-live-update
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Refresh and verify YouTube live data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG Live Stream Bot"
          git config user.email "actions@users.noreply.github.com"

          published=0
          for attempt in 1 2 3; do
            echo "YouTube refresh attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main

            if ! python scripts/update_youtube_live.py; then
              echo "Scanner failed; retrying."
              sleep $((attempt * 5))
              continue
            fi
            if ! python scripts/verify_youtube_live.py; then
              echo "Verifier failed; retrying."
              sleep $((attempt * 5))
              continue
            fi
            if ! python scripts/validate_youtube_live.py; then
              echo "Output validation failed; retrying without publishing."
              sleep $((attempt * 5))
              continue
            fi

            if git diff --quiet -- youtube-live.json; then
              echo "No stream-state change."
              published=1
              break
            fi

            git add youtube-live.json
            git commit -m "Update verified YouTube live streams"
            if git push origin HEAD:main; then
              published=1
              break
            fi
            echo "Push raced with another automation; retrying."
            sleep $((attempt * 5))
          done

          if [ "$published" -ne 1 ]; then
            echo "Unable to publish YouTube verification after retries."
            exit 1
          fi
