name: Cache TAT guest team logos once
on:
  push:
    branches: [main]
    paths:
      - "scripts/cache_tat_guest_team_logos.py"
      - ".github/workflows/cache-tat-guest-team-logos-once.yml"
permissions:
  contents: write
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - run: python scripts/cache_tat_guest_team_logos.py
      - name: Commit team logos
        run: |
          set -euo pipefail
          git config user.name "IMG TAT Assets"
          git config user.email "actions@users.noreply.github.com"
          git add assets/tat/teams
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Store missing TAT guest team logos"
          git pull --rebase origin main
          git push origin HEAD:main
