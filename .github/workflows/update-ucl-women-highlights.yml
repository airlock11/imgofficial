name: Update Women's Champions League highlights
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/football_highlights_common.py"
      - "scripts/update_ucl_women_highlights.py"
      - ".github/workflows/update-ucl-women-highlights.yml"
permissions:
  contents: write
concurrency:
  group: ucl-women-highlights-update
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh Women's Champions League highlights
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG Women's Champions League Highlights Bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_ucl_women_highlights.py
            if [ -z "$(git status --porcelain -- ucl-women-highlights.json)" ]; then
              echo "No Women's Champions League highlight changes."
              exit 0
            fi
            git add ucl-women-highlights.json
            git commit -m "Update Women's Champions League highlights"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push raced with another main update; regenerating (attempt $attempt)."
          done
          echo "Unable to publish Women's Champions League highlights after retries."
          exit 1
