# automation-audit: 2026-09-22
name: Update sports news data

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_news.py"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

concurrency:
  group: sports-news-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install news dependencies
        run: python -m pip install --disable-pip-version-check feedparser beautifulsoup4 yt-dlp

      - name: Refresh sports news
        run: python scripts/update_news.py

      - name: Commit updated news
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG News Data Bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python scripts/update_news.py

            if git diff --quiet -- news-data.json; then
              echo "No data changes."
              exit 0
            fi

            git add news-data.json
            git commit -m "Update sports news data"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another automation; regenerating from latest main (attempt $attempt)."
          done

          echo "Unable to publish after retries."
          exit 1
