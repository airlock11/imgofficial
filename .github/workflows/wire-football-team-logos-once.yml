name: Wire football team crests once
on:
  push:
    branches: [main]
    paths:
      - "scripts/wire_football_team_logos_once.py"
      - ".github/workflows/wire-football-team-logos-once.yml"
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire league pages
        run: python scripts/wire_football_team_logos_once.py
      - name: Publish
        run: |
          git config user.name "IMG Asset Builder"
          git config user.email "actions@users.noreply.github.com"
          git add leagues/el-salvador-reserves/index.html leagues/serie-a/index.html leagues/bundesliga/index.html leagues/champions-league/index.html leagues/champions-league-women/index.html leagues/mls/index.html leagues/pfl/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finish football team crest integration"
          git pull --rebase origin main
          git push origin HEAD:main
