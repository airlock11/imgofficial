name: Cache football league logos once

on:
  push:
    branches: [main]
    paths:
      - "scripts/cache_football_league_logos.py"
      - ".github/workflows/cache-football-league-logos-once.yml"

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Download football league logos
        run: python scripts/cache_football_league_logos.py
      - name: Commit local league logos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG Football Assets"
          git config user.email "actions@users.noreply.github.com"
          git add assets/football/leagues
          if git diff --cached --quiet; then
            echo "No league-logo changes."
            exit 0
          fi
          git commit -m "Store football league logos locally"
          git pull --rebase origin main
          git push origin HEAD:main
