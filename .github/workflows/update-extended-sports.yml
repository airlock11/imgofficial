# automation-audit: 2026-09-22
name: Update extended sports data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_extended_sports.py"
      - ".github/workflows/update-extended-sports.yml"

permissions:
  contents: write

concurrency:
  group: extended-sports-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4 lxml pypdf
      - name: Refresh extended sports data
        run: python scripts/update_extended_sports.py
      - name: Commit updated data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG Sports Data Bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python scripts/update_extended_sports.py

            if git diff --quiet -- extended-sports-data.json; then
              echo "No data changes."
              exit 0
            fi

            git add extended-sports-data.json
            git commit -m "Update extended sports data"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another automation; regenerating from latest main (attempt $attempt)."
          done

          echo "Unable to publish after retries."
          exit 1
