name: Update extended sports data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_extended_sports.py"
      - ".github/workflows/update-extended-sports.yml"

permissions:
  contents: write

concurrency:
  group: extended-sports-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4 lxml
      - name: Refresh extended sports data
        run: python scripts/update_extended_sports.py
      - name: Commit updated data
        shell: bash
        run: |
          if git diff --quiet -- extended-sports-data.json; then
            echo "No extended sports data changes."
            exit 0
          fi
          git config user.name "IMG Sports Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add extended-sports-data.json
          git commit -m "Update extended sports data"
          git fetch origin main
          git rebase origin/main
          git push
