name: Update football team logos
on:
  schedule:
    - cron: "27 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/football_team_logos_common.py"
      - "scripts/update_*_team_logos.py"
      - ".github/workflows/update-football-team-logos.yml"
permissions:
  contents: write
concurrency:
  group: football-team-logos-update
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow beautifulsoup4
      - name: Build independent league team logos
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_premier_league_team_logos.py
          python scripts/update_laliga_team_logos.py
          python scripts/update_seriea_team_logos.py
          python scripts/update_bundesliga_team_logos.py
          python scripts/update_champions_team_logos.py
          python scripts/update_ucl_women_team_logos.py
          python scripts/update_mls_team_logos.py
          python scripts/update_jamaica_pl_team_logos.py
          python scripts/update_mizoram_pl_team_logos.py
          python scripts/update_el_salvador_reserves_team_logos.py
          python scripts/update_pfl_team_logos.py
      - name: Publish team logo registries and assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG Football Team Logos Bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- assets/football/teams *-teams.json)" ]; then
            echo "No football team logo changes."
            exit 0
          fi
          git add assets/football/teams *-teams.json
          git commit -m "Update football team logos"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
