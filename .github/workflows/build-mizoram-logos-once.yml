name: Build Mizoram logos once
on:
  push:
    branches: [main]
    paths:
      - "scripts/build_mizoram_team_logos_once.py"
      - "scripts/wire_football_team_logos_once.py"
      - ".github/workflows/build-mizoram-logos-once.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow requests
      - name: Build Mizoram crests
        run: |
          python scripts/build_mizoram_team_logos_once.py > /tmp/mizoram.json
          python - <<'PY'
          import json,re
          p='football-team-logos.js'
          raw=open(p,encoding='utf-8').read()
          m=re.search(r'window\.IMG_FOOTBALL_TEAM_LOGOS=(.*);\s*$',raw,re.S)
          data=json.loads(m.group(1)) if m else {}
          obj=json.load(open('/tmp/mizoram.json'))
          data['mizoram_pl']=obj.get('logos',{})
          open(p,'w',encoding='utf-8').write('window.IMG_FOOTBALL_TEAM_LOGOS='+json.dumps(data,separators=(',',':'))+';\n')
          report=json.load(open('football-team-logos-report.json'))
          report['mizoram_pl']={'count':len(obj.get('logos',{})),'missing':obj.get('missing',[]),'failed':[]}
          open('football-team-logos-report.json','w',encoding='utf-8').write(json.dumps(report,indent=2)+'\n')
          if obj.get('missing'): raise SystemExit('Missing Mizoram crests: '+', '.join(obj['missing']))
          PY
      - name: Wire remaining league pages
        run: python scripts/wire_football_team_logos_once.py
      - name: Publish
        run: |
          git config user.name "IMG Asset Builder"
          git config user.email "actions@users.noreply.github.com"
          git add assets/football/teams/mizoram_pl football-team-logos.js football-team-logos-report.json leagues/el-salvador-reserves/index.html leagues/serie-a/index.html leagues/bundesliga/index.html leagues/champions-league/index.html leagues/champions-league-women/index.html leagues/mls/index.html leagues/pfl/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finish football team crest integration"
          git pull --rebase origin main
          git push origin HEAD:main
