name: Cache TAT assets once
on:
  push:
    branches: [main]
    paths:
      - "scripts/cache_tat_assets.py"
      - ".github/workflows/cache-tat-assets-once.yml"
permissions:
  contents: write
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python scripts/cache_tat_assets.py
      - run: |
          git config user.name "IMG TAT Assets"
          git config user.email "actions@users.noreply.github.com"
          git add assets/tat
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Store official TAT logos and team assets"
          git pull --rebase origin main
          git push origin HEAD:main
