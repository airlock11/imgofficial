# automation-audit: 2026-09-22
name: Update Asian Games official web data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_asian_games_web.py"
      - "scripts/asian_live_expiry.py"
      - ".github/workflows/update-asian-games-web.yml"

permissions:
  contents: write

concurrency:
  group: asian-games-web-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install browser scraper
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright
          if ! command -v google-chrome >/dev/null 2>&1; then
            python -m playwright install --with-deps chromium
          fi
      - name: Refresh and publish Asian Games data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG Asian Games Data Bot"
          git config user.email "actions@users.noreply.github.com"

          # Collect once. Publishing retries must not rerun the slow scraper.
          git fetch origin main
          git reset --hard origin/main
          python scripts/update_asian_games_web.py

          if git diff --quiet -- special-sports-data.json; then
            echo "No Asian Games data changes."
            exit 0
          fi

          git add special-sports-data.json
          git commit -m "Update Asian Games official web data"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict while publishing special-sports-data.json."
              exit 1
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another automation; retrying publish only (attempt $attempt)."
            sleep 2
          done

          echo "Unable to publish after retries."
          exit 1
