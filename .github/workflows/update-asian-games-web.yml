# automation-audit: 2026-09-22
name: Update Asian Games official web data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_asian_games_web.py"
      - "scripts/asian_live_expiry.py"
      - ".github/workflows/update-asian-games-web.yml"

permissions:
  contents: write

concurrency:
  group: asian-games-web-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser scraper
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright
          if ! command -v google-chrome >/dev/null 2>&1; then
            python -m playwright install --with-deps chromium
          fi
      - name: Refresh and publish Asian Games data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG Asian Games Data Bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python scripts/update_asian_games_web.py

            if git diff --quiet -- special-sports-data.json; then
              echo "No Asian Games data changes."
              exit 0
            fi

            git add special-sports-data.json
            git commit -m "Update Asian Games official web data"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another main update; regenerating from latest main (attempt $attempt)."
          done

          echo "Unable to publish Asian Games data after retries."
          exit 1
