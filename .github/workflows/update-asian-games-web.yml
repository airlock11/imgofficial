name: Update Asian Games official web data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_asian_games_web.py"
      - ".github/workflows/update-asian-games-web.yml"

permissions:
  contents: write

concurrency:
  group: asian-games-web-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser scraper
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Refresh Asian Games official web data
        run: python scripts/update_asian_games_web.py
      - name: Publish refreshed Asian Games data
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- special-sports-data.json; then
            echo "No Asian Games data changes."
            exit 0
          fi
          git config user.name "IMG Asian Games Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add special-sports-data.json
          git commit -m "Update Asian Games official web data"
          git fetch origin main
          git rebase origin/main
          git push
