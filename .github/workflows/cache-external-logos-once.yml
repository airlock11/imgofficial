name: Cache external logos once

on:
  push:
    branches: [main]
    paths:
      - "scripts/cache_external_logos.py"
      - ".github/workflows/cache-external-logos-once.yml"

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install downloader dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Scan, download and localize external logos
        id: cache
        continue-on-error: true
        run: python scripts/cache_external_logos.py

      - name: Commit downloaded logos and rewritten references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG Logo Cache"
          git config user.email "actions@users.noreply.github.com"
          git add assets/logos/external .
          if git diff --cached --quiet; then
            echo "No logo changes to commit."
          else
            git commit -m "Store external site logos locally"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fail if any detected logo could not be cached
        if: steps.cache.outcome == 'failure'
        run: |
          echo "Some external logo URLs could not be downloaded. See assets/logos/external/SOURCES.json."
          exit 1
