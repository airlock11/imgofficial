name: Build UAAP HQ hero

on:
  push:
    branches: [main]
    paths:
      - "assets/uaap/uaap-hero-hq.webp"
      - "scripts/build_uaap_hero_hq.py"
      - ".github/workflows/build-uaap-hero-hq.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-uaap-hq-hero
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build sharpened high-resolution UAAP hero
        run: python scripts/build_uaap_hero_hq.py

      - name: Publish HQ hero
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- assets/uaap/uaap-hero-hq-v7.jpg)" ]; then
            echo "HQ hero is already current."
            exit 0
          fi
          git config user.name "IMG Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/uaap/uaap-hero-hq-v7.jpg
          git commit -m "Build PBA-quality UAAP hero JPEG"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
