# automation-audit: 2026-09-22
name: Update boxing fighter data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_boxing_data.py"
      - ".github/workflows/update-boxing-data.yml"

permissions:
  contents: write

concurrency:
  group: boxing-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify API secret
        shell: bash
        run: |
          if [ -z "$RAPIDAPI_KEY" ]; then
            echo "RAPIDAPI_KEY repository secret is missing."
            exit 1
          fi

      - name: Refresh boxer directory
        run: python scripts/update_boxing_data.py

      - name: Commit updated boxing data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG Boxing Data Bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python scripts/update_boxing_data.py

            if git diff --quiet -- boxing-data.json boxing-fights-data.json; then
              echo "No data changes."
              exit 0
            fi

            git add boxing-data.json boxing-fights-data.json
            git commit -m "Update boxing fighter data"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another automation; regenerating from latest main (attempt $attempt)."
          done

          echo "Unable to publish after retries."
          exit 1
