name: Update El Salvador Reserves highlights
on:
  schedule:
    - cron: "23,53 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/football_highlights_common.py"
      - "scripts/update_el_salvador_reserves_highlights.py"
      - ".github/workflows/update-el-salvador-reserves-highlights.yml"
permissions:
  contents: write
concurrency:
  group: el-salvador-reserves-highlights-update
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh El Salvador Reserves highlights
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG El Salvador Reserves Highlights Bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_el_salvador_reserves_highlights.py
            if [ -z "$(git status --porcelain -- el-salvador-reserves-highlights.json)" ]; then
              echo "No El Salvador Reserves highlight changes."
              exit 0
            fi
            git add el-salvador-reserves-highlights.json
            git commit -m "Update El Salvador Reserves highlights"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push raced with another main update; regenerating (attempt $attempt)."
          done
          echo "Unable to publish El Salvador Reserves highlights after retries."
          exit 1
