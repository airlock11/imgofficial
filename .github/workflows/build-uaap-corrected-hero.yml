name: Build corrected UAAP hero

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_uaap_corrected_hero.py"
      - "assets/uaap/teams/**"
      - ".github/workflows/build-uaap-corrected-hero.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-uaap-corrected-hero
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build corrected UAAP hero
        run: python scripts/build_uaap_corrected_hero.py

      - name: Validate generated hero
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path("assets/uaap/uaap-hero-corrected-v10.jpg")
          assert p.exists(), "generated hero missing"
          im=Image.open(p)
          assert im.size == (2560,1440), im.size
          assert p.stat().st_size > 350000, p.stat().st_size
          print("validated", im.size, p.stat().st_size)
          PY

      - name: Publish generated hero
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- assets/uaap/uaap-hero-corrected-v10.jpg)" ]; then
            echo "Corrected hero already current."
            exit 0
          fi
          git config user.name "IMG Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/uaap/uaap-hero-corrected-v10.jpg
          git commit -m "Build corrected UAAP hero asset"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
