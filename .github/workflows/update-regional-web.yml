# automation-audit: 2026-09-22
name: Update regional basketball web data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_regional_web.py"
      - ".github/workflows/update-regional-web.yml"

permissions:
  contents: write

concurrency:
  group: regional-web-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install image OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python -m pip install --disable-pip-version-check beautifulsoup4 pillow pytesseract lxml
      - name: Refresh and publish regional basketball web data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG Web Data Bot"
          git config user.email "actions@users.noreply.github.com"

          # Collect once. Publishing retries must not rerun the slow scraper.
          git fetch origin main
          git reset --hard origin/main
          python scripts/update_regional_web.py

          if git diff --quiet -- regional-web.json; then
            echo "No regional data changes."
            exit 0
          fi

          git add regional-web.json
          git commit -m "Update regional basketball web data"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict while publishing regional-web.json."
              exit 1
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another automation; retrying publish only (attempt $attempt)."
            sleep 2
          done

          echo "Unable to publish after retries."
          exit 1
