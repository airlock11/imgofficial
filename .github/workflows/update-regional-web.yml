name: Update regional basketball web data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python -m pip install --disable-pip-version-check beautifulsoup4 pillow pytesseract lxml
      - name: Refresh PBA MPBL and NBL-Pilipinas web data
        run: python scripts/update_regional_web.py
      - name: Commit updated data
        shell: bash
        run: |
          if git diff --quiet -- regional-web.json; then
            echo "No regional data changes."
            exit 0
          fi
          git config user.name "IMG Web Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add regional-web.json
          git commit -m "Update regional basketball web data"
          git push
