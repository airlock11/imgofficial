name: Reconstruct exact UAAP hero

on:
  push:
    branches:
      - uaap-pba-hero-exact
    paths:
      - "assets/uaap/.hero-upload.b64"
      - ".github/workflows/reconstruct-uaap-exact-hero.yml"

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Decode staged hero
        run: |
          base64 -d assets/uaap/.hero-upload.b64 > assets/uaap/uaap-hero-user-exact.avif
          ls -lh assets/uaap/uaap-hero-user-exact.avif

      - name: Validate exact hero
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path("assets/uaap/uaap-hero-user-exact.avif")
          im=Image.open(p)
          im.load()
          assert im.size == (1536, 512), im.size
          print("validated", im.format, im.size, p.stat().st_size)
          PY

      - name: Publish reconstructed hero to branch
        run: |
          git config user.name "IMG Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/uaap/uaap-hero-user-exact.avif
          if git diff --cached --quiet; then
            echo "Hero already current"
            exit 0
          fi
          git commit -m "Reconstruct exact UAAP user hero"
          git push origin HEAD:uaap-pba-hero-exact
