name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-cloudflare-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to GitHub Actions secrets."
            exit 1
          fi

      - name: Sync YouTube API secret to Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::error::YOUTUBE_API_KEY is missing from GitHub Actions secrets."
            exit 1
          fi
          printf '%s' "$YOUTUBE_API_KEY" | npx --yes wrangler@4 secret put YOUTUBE_API_KEY

      - name: Deploy IMG API Worker
        run: npx --yes wrangler@4 deploy

      - name: Verify IMG livestream endpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://img-api-proxy.magsipocarnie.workers.dev"

          health=""
          live=""
          for attempt in 1 2 3 4 5; do
            health="$(curl -fsS --max-time 12 "$BASE/health" || true)"
            live="$(curl -fsS --max-time 12 "$BASE/live-streams" || true)"
            if [ -n "$health" ] && [ -n "$live" ]; then
              break
            fi
            sleep 3
          done

          HEALTH_JSON="$health" LIVE_JSON="$live" python - <<'PY'
          import json, os

          health = json.loads(os.environ["HEALTH_JSON"])
          live = json.loads(os.environ["LIVE_JSON"])

          if health.get("ok") is not True:
              raise SystemExit("Cloudflare /health did not return ok=true")
          if not isinstance(live.get("streams"), list):
              raise SystemExit("Cloudflare /live-streams did not return a streams array")

          configured = health.get("configured") or {}
          cf = live.get("cloudflareLiveVerification") or {}
          asian = [
              item for item in live.get("streams", [])
              if item.get("leagueKey") == "asian_games"
          ]

          print("Cloudflare YouTube configured:", bool(configured.get("youtube")))
          print("Cloudflare live verification status:", cf.get("status", "missing"))
          print("Cloudflare Asian Games verified live count:", len(asian))
          print("Cloudflare feed updatedAt:", live.get("updatedAt", ""))

          if not configured.get("youtube"):
              raise SystemExit("Cloudflare YOUTUBE_API_KEY is not configured")
          if cf.get("status") != "verified":
              raise SystemExit("Cloudflare direct YouTube verification is not active")
          PY
