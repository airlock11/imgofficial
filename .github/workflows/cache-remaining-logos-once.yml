name: Cache remaining logos once

on:
  push:
    branches: [main]
    paths:
      - "scripts/cache_remaining_logos.py"
      - ".github/workflows/cache-remaining-logos-once.yml"

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --disable-pip-version-check requests

      - name: Cache the remaining Wikimedia-hosted logos
        id: retry
        continue-on-error: true
        run: python scripts/cache_remaining_logos.py

      - name: Commit remaining local logos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG Logo Cache"
          git config user.email "actions@users.noreply.github.com"
          git add assets/logos/external .
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Store remaining site logos locally"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Require complete remaining-logo cache
        if: steps.retry.outcome == 'failure'
        run: |
          echo "At least one remaining logo still could not be cached."
          exit 1
