name: Update boxing highlights
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_boxing_highlights.py"
      - "boxing-highlights.json"
      - ".github/workflows/update-boxing-highlights.yml"
permissions:
  contents: write
concurrency:
  group: boxing-highlights-update
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh official boxing highlights
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG Boxing Highlights Bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python scripts/update_boxing_highlights.py

            if git diff --quiet -- boxing-highlights.json; then
              echo "No boxing highlight changes."
              exit 0
            fi

            git add boxing-highlights.json
            git commit -m "Update official boxing highlights"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another main update; regenerating from latest main (attempt $attempt)."
          done

          echo "Unable to publish boxing highlights after retries."
          exit 1
