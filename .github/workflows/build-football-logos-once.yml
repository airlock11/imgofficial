name: Build football logos once
on:
  push:
    branches: [main]
    paths:
      - "scripts/build_espn_team_logos_once.py"
      - ".github/workflows/build-football-logos-once.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow requests cairosvg
      - name: Build current major-league crests
        run: |
          mkdir -p /tmp/img-logos
          python scripts/build_espn_team_logos_once.py soccer eng.1 > /tmp/img-logos/soccer.json
          python scripts/build_espn_team_logos_once.py laliga esp.1 > /tmp/img-logos/laliga.json
          python scripts/build_espn_team_logos_once.py seriea ita.1 > /tmp/img-logos/seriea.json
          python scripts/build_espn_team_logos_once.py bundesliga ger.1 > /tmp/img-logos/bundesliga.json
          python scripts/build_espn_team_logos_once.py champions uefa.champions > /tmp/img-logos/champions.json
          python scripts/build_espn_team_logos_once.py mls usa.1 > /tmp/img-logos/mls.json
          python scripts/build_espn_team_logos_once.py ucl_women uefa.wchampions > /tmp/img-logos/ucl_women.json || echo '{}' > /tmp/img-logos/ucl_women.json
          python - <<'PY'
          import json,glob,os
          data={}
          for p in glob.glob('/tmp/img-logos/*.json'):
              data[os.path.basename(p)[:-5]]=json.load(open(p))
          open('football-team-logos.js','w').write('window.IMG_FOOTBALL_TEAM_LOGOS='+json.dumps(data,separators=(',',':'))+';\n')
          open('football-team-logos-report.json','w').write(json.dumps({k:len(v) for k,v in data.items()},indent=2)+'\n')
          PY
      - name: Commit logo assets
        run: |
          git config user.name "IMG Asset Builder"
          git config user.email "actions@users.noreply.github.com"
          git add assets/football/teams football-team-logos.js football-team-logos-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add high quality football team logos"
          git pull --rebase origin main
          git push origin HEAD:main
