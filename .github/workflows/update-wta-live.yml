name: Update WTA live scores

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_wta_live.py"
      - ".github/workflows/update-wta-live.yml"

permissions:
  contents: write

concurrency:
  group: wta-live-minute
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh and publish WTA live data every minute
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG WTA Live Bot"
          git config user.email "actions@users.noreply.github.com"

          for cycle in 1 2 3 4 5; do
            echo "WTA live cycle $cycle/5"

            pushed=0
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main

              python scripts/update_wta_live.py

              if git diff --quiet -- wta-live.json; then
                echo "No WTA live-score changes."
                pushed=1
                break
              fi

              git add wta-live.json
              git commit -m "Update WTA live scores"
              if git push origin HEAD:main; then
                pushed=1
                break
              fi

              echo "Push raced; retrying."
            done

            if [ "$pushed" -ne 1 ]; then
              echo "Unable to publish WTA live cycle."
              exit 1
            fi

            if [ "$cycle" -lt 5 ]; then
              sleep 60
            fi
          done
