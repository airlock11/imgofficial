name: Update WTA live scores

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_wta_live.py"
      - ".github/workflows/update-wta-live.yml"

permissions:
  contents: write

concurrency:
  group: wta-live-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4 lxml
      - name: Scrape rendered WTA scores
        run: python scripts/update_wta_live.py
      - name: Publish WTA live data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG Sports Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python scripts/update_wta_live.py
          if git diff --quiet -- wta-live-data.json; then
            echo "No WTA live-score changes."
            exit 0
          fi
          git add wta-live-data.json
          git commit -m "Update WTA live scores"
          git push origin HEAD:main
