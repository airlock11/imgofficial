name: Update WTA live scores

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_wta_live.py"
      - "scripts/update_wta_api.py"
      - ".github/workflows/update-wta-live.yml"

permissions:
  contents: write

concurrency:
  group: wta-live-minute
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4 lxml

      - name: Continuously publish WTA live scores
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG WTA Live Bot"
          git config user.email "actions@users.noreply.github.com"

          for cycle in $(seq 1 60); do
            echo "WTA live cycle $cycle/60"

            git checkout main
            git fetch origin main
            git reset --hard origin/main

            if python scripts/update_wta_api.py; then
              echo "WTA source: API-Tennis"
            else
              echo "API-Tennis unavailable; using WTA official page fallback."
              python scripts/update_wta_live.py
            fi
            cp wta-live.json /tmp/wta-live.json

            # Discard the generated copy on main before switching branches.
            git reset --hard origin/main
            git fetch origin wta-live-data
            git checkout -B wta-live-data origin/wta-live-data
            cp /tmp/wta-live.json wta-live.json

            if ! git diff --quiet -- wta-live.json; then
              git add wta-live.json
              git commit -m "Update WTA live scores"
              git push origin HEAD:wta-live-data
            else
              echo "No WTA live-score changes."
            fi
          done
