name: Site integrity check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Audit repository files and inline scripts
        run: python scripts/repository_audit.py
      - name: Check JavaScript syntax
        run: |
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | while IFS= read -r -d '' f; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Check startup and player regressions
        run: node scripts/regression-tests.cjs
      - name: Check backend contracts
        run: node scripts/backend-contract-tests.cjs
      - name: Check SEO contracts
        run: node scripts/seo-tests.cjs
      - name: Check AdSense readiness
        run: node scripts/ads-readiness-tests.cjs
      - name: Validate YouTube live output contract
        run: python scripts/validate_youtube_live.py
      - name: Check news embedding permissions
        run: python scripts/test_news_embed.py
      - name: Check Python syntax
        run: |
          python - <<'PY'
          import pathlib, py_compile
          for p in pathlib.Path('.').rglob('*.py'):
              if '.git' not in p.parts:
                  print('Checking', p)
                  py_compile.compile(str(p), doraise=True)
          PY
      - name: Check JSON syntax
        run: |
          python - <<'PY'
          import json, pathlib
          for p in pathlib.Path('.').rglob('*.json'):
              if '.git' not in p.parts:
                  print('Checking', p)
                  with p.open(encoding='utf-8') as f:
                      json.load(f)
          PY
      - name: Check production homepage and retired Asian Games references
        run: |
          python - <<'PY'
          import pathlib, re
          bad=[]
          home=pathlib.Path('index.html').read_text(encoding='utf-8',errors='replace')
          for marker in ('IMG — System Down','System unavailable','window.location.replace("https://www.img.com/")'):
              if marker in home:
                  bad.append('index.html: temporary maintenance/redirect marker remains')
          retired=[
              pathlib.Path('sports/index.html'),
              pathlib.Path('scores/index.html'),
              pathlib.Path('app.js'),
              pathlib.Path('score-league-user-logos.js'),
              pathlib.Path('special-sports-data.json'),
              pathlib.Path('youtube-live.json'),
          ]
          pattern=re.compile(r'Asian Games|asian_games|asiangames2026|Aichi-Nagoya|ag26-',re.I)
          for p in retired:
              if p.exists() and pattern.search(p.read_text(encoding='utf-8',errors='replace')):
                  bad.append(f'{p}: retired Asian Games reference remains')
          if pathlib.Path('asian-stream-accuracy.js').exists():
              bad.append('asian-stream-accuracy.js: obsolete retired file still exists')
          if bad:
              raise SystemExit('\n'.join(bad))
          PY
      - name: Check merge markers and accidental escaped newlines
        run: |
          python - <<'PY'
          import pathlib
          exts={'.js','.py','.html','.css','.json','.yml','.yaml'}
          bad=[]
          for p in pathlib.Path('.').rglob('*'):
              if not p.is_file() or p.suffix not in exts or '.git' in p.parts: continue
              s=p.read_text(encoding='utf-8',errors='replace')
              if ('<'*7 + ' HEAD') in s or ('>'*7 + ' ') in s:
                  bad.append(f'{p}: unresolved merge marker')
              if p.suffix=='.js' and ('{\\n  if(' in s or ';\\n  if(' in s):
                  bad.append(f'{p}: suspicious literal escaped newline')
          if bad:
              raise SystemExit('\n'.join(bad))
          PY
