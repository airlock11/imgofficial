name: Site integrity check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          find . -type f -name '*.js' -not -path './.git/*' -print0 | while IFS= read -r -d '' f; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Check startup and player regressions
        run: node scripts/regression-tests.cjs
      - name: Check backend contracts
        run: node scripts/backend-contract-tests.cjs
      - name: Check SEO contracts
        run: node scripts/seo-tests.cjs
      - name: Check AdSense readiness
        run: node scripts/ads-readiness-tests.cjs
      - name: Validate YouTube live output contract
        run: python scripts/validate_youtube_live.py
      - name: Check news embedding permissions
        run: python scripts/test_news_embed.py
      - name: Check Asian Games expiry and rediscovery
        run: python scripts/test_asian_live_expiry.py
      - name: Check Python syntax
        run: |
          python - <<'PY'
          import pathlib, py_compile
          for p in pathlib.Path('.').rglob('*.py'):
              if '.git' not in p.parts:
                  print('Checking', p)
                  py_compile.compile(str(p), doraise=True)
          PY
      - name: Check JSON syntax
        run: |
          python - <<'PY'
          import json, pathlib
          for p in pathlib.Path('.').rglob('*.json'):
              if '.git' not in p.parts:
                  print('Checking', p)
                  with p.open(encoding='utf-8') as f:
                      json.load(f)
          PY
      - name: Check merge markers and accidental escaped newlines
        run: |
          python - <<'PY'
          import pathlib
          exts={'.js','.py','.html','.css','.json','.yml','.yaml'}
          bad=[]
          for p in pathlib.Path('.').rglob('*'):
              if not p.is_file() or p.suffix not in exts or '.git' in p.parts: continue
              s=p.read_text(encoding='utf-8',errors='replace')
              if ('<'*7 + ' HEAD') in s or ('>'*7 + ' ') in s:
                  bad.append(f'{p}: unresolved merge marker')
              if p.suffix=='.js' and ('{\\n  if(' in s or ';\\n  if(' in s):
                  bad.append(f'{p}: suspicious literal escaped newline')
          if bad:
              raise SystemExit('\n'.join(bad))
          PY
