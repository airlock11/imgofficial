# automation-audit: 2026-09-22
name: Refresh OddsPapi team metadata

on:
  schedule:
    - cron: "47 0 1 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_odds_meta.py"
      - ".github/workflows/update-odds-meta.yml"

permissions:
  contents: write

concurrency:
  group: odds-data-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Refresh team-name cache
        run: python scripts/update_odds_meta.py
      - name: Commit metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG Odds Data Bot"
          git config user.email "actions@users.noreply.github.com"

          cp odds-meta.json /tmp/odds-meta.json

          git fetch origin main
          git reset --hard origin/main
          cp /tmp/odds-meta.json odds-meta.json

          if git diff --quiet -- odds-meta.json; then
            echo "No data changes."
            exit 0
          fi

          git add odds-meta.json
          git commit -m "Refresh OddsPapi team metadata"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict while publishing odds metadata."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another automation; retrying publish only (attempt $attempt)."
            sleep 2
          done

          echo "Unable to publish after retries."
          exit 1
