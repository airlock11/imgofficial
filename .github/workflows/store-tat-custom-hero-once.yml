name: Store TAT custom hero once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/store-tat-custom-hero-once.yml"

permissions:
  contents: write

jobs:
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decode custom TAT hero
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/tat
          base64 -d scripts/tat-hero-upload/hero.b64 > assets/tat/tat-hero-custom.jpg
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from PIL import Image
          p="assets/tat/tat-hero-custom.jpg"
          im=Image.open(p)
          assert im.format == "JPEG", im.format
          assert im.size == (1536, 512), im.size
          im.verify()
          print("Verified", p, "1536x512 JPEG")
          PY
      - name: Commit hero
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG TAT Assets"
          git config user.email "actions@users.noreply.github.com"
          git add assets/tat/tat-hero-custom.jpg
          git rm -r scripts/tat-hero-upload
          git commit -m "Store custom TAT hero image"
          git pull --rebase origin main
          git push origin HEAD:main
