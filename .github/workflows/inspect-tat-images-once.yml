name: Inspect TAT images once
on:
  push:
    branches: [main]
    paths:
      - "scripts/inspect_tat_images.py"
      - ".github/workflows/inspect-tat-images-once.yml"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python scripts/inspect_tat_images.py
      - run: |
          git config user.name "IMG TAT Assets"
          git config user.email "actions@users.noreply.github.com"
          git add tat-site-image-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Inspect official TAT image assets"
          git pull --rebase origin main
          git push origin HEAD:main
