# automation-audit: 2026-09-22
name: Update sports statistics

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_stats.py"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

concurrency:
  group: sports-stats-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4 lxml
      - name: Refresh sports statistics
        run: python scripts/update_stats.py
      - name: Publish statistics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "IMG Stats Bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python scripts/update_stats.py

            if git diff --quiet -- stats-data.json; then
              echo "No data changes."
              exit 0
            fi

            git add stats-data.json
            git commit -m "Update sports statistics"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another automation; regenerating from latest main (attempt $attempt)."
          done

          echo "Unable to publish after retries."
          exit 1
