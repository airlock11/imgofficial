# automation-audit: 2026-09-22
name: Update official boxing web data

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_boxing_web.py"
      - ".github/workflows/update-boxing-web.yml"

permissions:
  contents: write

concurrency:
  group: boxing-web-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Refresh official boxing web data
        run: python scripts/update_boxing_web.py

      - name: Commit updated boxing web data
        shell: bash
        run: |
          if git diff --quiet -- boxing-web-data.json; then
            echo "No boxing web data changes."
            exit 0
          fi
          git config user.name "IMG Boxing Web Bot"
          git config user.email "actions@users.noreply.github.com"
          git add boxing-web-data.json
          git commit -m "Update official boxing web data"
          git fetch origin main
          git rebase origin/main
          git push
