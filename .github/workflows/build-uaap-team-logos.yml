name: Build UAAP Team Logos

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_uaap_team_logos.py"
      - ".github/workflows/build-uaap-team-logos.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-uaap-team-logos
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download and prepare official UAAP team logos
        run: python scripts/build_uaap_team_logos.py

      - name: Publish local UAAP team logos
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- assets/uaap/teams)" ]; then
            echo "UAAP team logos are already current."
            exit 0
          fi
          git config user.name "IMG Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/uaap/teams
          git commit -m "Build official UAAP team logo assets"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
