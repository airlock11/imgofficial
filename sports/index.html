<!doctype html><html lang="en"><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="canonical" href="https://www.imgofficial.com/sports/"><title>Sports — IMG</title><link rel="icon" type="image/png" href="./img-logo-hq.png?v=20260920-11"><link rel="shortcut icon" type="image/png" href="./img-logo-hq.png?v=20260920-11"><link rel="apple-touch-icon" href="./img-logo-hq.png?v=20260920-11"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css?v=20260922-104"><link rel="stylesheet" href="mobile-nav.css?v=20260920-6"><link rel="stylesheet" href="theme-toggle.css?v=20260920-10"></head><body class="sports-page">
<header><nav class="shell"><a class="logo" href="/"><img src="img-logo-hq.png" alt="IMG"></a><div class="navlinks"><a href="/">Home</a><a class="active" href="/sports/">Sports</a><a href="/scores/">Scores</a><a href="/news/">News</a><a href="/odds/">Odds</a></div></nav></header>
<main><section class="content sports-directory"><div class="shell">
  <div class="sports-directory-head"><h1>Sports</h1><span id="sportsCount"></span></div>
  <div id="sportTabs" class="sports-tabbar" role="tablist" aria-label="Choose a sport"></div>
  <section id="sportPanel" class="sports-stage" aria-live="polite"></section>
</div></section></main>
<div class="bottomnav"><a href="/"><b><span class="navglyph icon-home" aria-hidden="true"></span></b>Home</a><a class="active" href="/sports/"><b><span class="navglyph icon-sports" aria-hidden="true"></span></b>Sports</a><a href="/scores/"><b><span class="navglyph icon-scores" aria-hidden="true"></span></b>Scores</a><a href="/news/"><b><span class="navglyph icon-news" aria-hidden="true"></span></b>News</a><a href="/odds/"><b><span class="navglyph icon-odds" aria-hidden="true"></span></b>Odds</a></div>
<script src="score-league-user-logos.js?v=20260921-94"></script>
<script>
// Sports page theme control — mirrors the shared IMG theme behavior without loading the full app bundle.
function sportsThemeRead(key){try{return localStorage.getItem(key)}catch{return null}}
function sportsThemeWrite(key,value){try{localStorage.setItem(key,value)}catch{}}
const sportsThemeRoot=document.documentElement;
sportsThemeRoot.dataset.theme=sportsThemeRead('img-theme')||'dark';
const sportsThemeButton=document.createElement('button');
sportsThemeButton.className='themebtn';
sportsThemeButton.type='button';
sportsThemeButton.setAttribute('aria-label','Switch color theme');
document.body.append(sportsThemeButton);
const sportsDesktopThemeMarkup='<span class="theme-track" aria-hidden="true"><span class="theme-icon sun"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span><span class="theme-icon moon"><svg viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg></span><span class="theme-thumb"></span></span>';
const sportsMobileThemeMarkup=()=>'<span class="theme-mobile-icon" aria-hidden="true">'+(sportsThemeRoot.dataset.theme==='dark'?'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg>')+'</span>';
const sportsThemeIsMobile=()=>matchMedia('(max-width:760px)').matches;
function sportsThemePaint(){
  sportsThemeButton.innerHTML=sportsDesktopThemeMarkup+sportsMobileThemeMarkup();
  sportsThemeButton.setAttribute('aria-pressed',sportsThemeRoot.dataset.theme==='light'?'true':'false');
  sportsThemeButton.title=sportsThemeRoot.dataset.theme==='dark'?'Switch to light mode':'Switch to dark mode';
}
sportsThemePaint();
let sportsThemeDrag=false,sportsThemeMoved=false,sportsThemeDx=0,sportsThemeDy=0;
function sportsThemeRestoreMobile(){
  if(!sportsThemeIsMobile())return;
  let pos=null;
  try{pos=JSON.parse(sportsThemeRead('img-theme-position')||'null')}catch{}
  if(!pos)return;
  const x=Math.max(8,Math.min(innerWidth-sportsThemeButton.offsetWidth-8,Number(pos.x)||8));
  const y=Math.max(8,Math.min(innerHeight-sportsThemeButton.offsetHeight-8,Number(pos.y)||8));
  sportsThemeButton.style.left=x+'px';sportsThemeButton.style.top=y+'px';sportsThemeButton.style.right='auto';sportsThemeButton.style.bottom='auto';
}
sportsThemeRestoreMobile();
sportsThemeButton.addEventListener('pointerdown',e=>{
  if(!sportsThemeIsMobile())return;
  sportsThemeDrag=true;sportsThemeMoved=false;
  const r=sportsThemeButton.getBoundingClientRect();
  sportsThemeDx=e.clientX-r.left;sportsThemeDy=e.clientY-r.top;
  sportsThemeButton.setPointerCapture(e.pointerId);
});
sportsThemeButton.addEventListener('pointermove',e=>{
  if(!sportsThemeDrag||!sportsThemeIsMobile())return;
  sportsThemeMoved=true;
  const x=Math.max(8,Math.min(innerWidth-sportsThemeButton.offsetWidth-8,e.clientX-sportsThemeDx));
  const y=Math.max(8,Math.min(innerHeight-sportsThemeButton.offsetHeight-8,e.clientY-sportsThemeDy));
  sportsThemeButton.style.left=x+'px';sportsThemeButton.style.top=y+'px';sportsThemeButton.style.right='auto';sportsThemeButton.style.bottom='auto';
});
sportsThemeButton.addEventListener('pointerup',()=>{
  if(!sportsThemeIsMobile()||!sportsThemeDrag)return;
  sportsThemeDrag=false;
  if(sportsThemeMoved){
    const r=sportsThemeButton.getBoundingClientRect();
    sportsThemeWrite('img-theme-position',JSON.stringify({x:Math.round(r.left),y:Math.round(r.top)}));
  }else{
    sportsThemeRoot.dataset.theme=sportsThemeRoot.dataset.theme==='dark'?'light':'dark';
    sportsThemeWrite('img-theme',sportsThemeRoot.dataset.theme);sportsThemePaint();
  }
});
sportsThemeButton.addEventListener('click',()=>{
  if(sportsThemeIsMobile())return;
  sportsThemeRoot.dataset.theme=sportsThemeRoot.dataset.theme==='dark'?'light':'dark';
  sportsThemeWrite('img-theme',sportsThemeRoot.dataset.theme);sportsThemePaint();
});

const sportsDirectory={
  Basketball:[
    ['NBA','United States / Canada','basketball'],['WNBA','United States / Canada','wnba'],['PBA','Philippines','pba'],['NCAA PH','Philippines','ncaa_ph'],['UAAP','Philippines','uaap'],['MPBL','Philippines','mpbl'],['NBL-Pilipinas','Philippines','nbl'],['NBL AUS','Australia / New Zealand','nblaus'],['VBA','Vietnam','vba'],['B.League','Japan','bleague'],['EuroLeague','Europe','euroleague'],['WBSL','International','wbsl']
  ],
  Football:[
    ['Premier League','England','soccer'],['La Liga','Spain','laliga'],['Serie A','Italy','seriea'],['Bundesliga','Germany','bundesliga'],['UEFA Champions League','Europe','champions'],['MLS','United States / Canada','mls'],['Philippine Football League','Philippines','pfl']
  ],
  Tennis:[
    ['ATP Tour','International','atp'],['WTA Tour','International','wta'],['Australian Open','Australia','australian_open'],['Wimbledon','United Kingdom','wimbledon'],['US Open','United States','us_open']
  ],
  Baseball:[['MLB','USA / Canada','baseball'],['NPB','Japan','npb'],['KBO League','South Korea','kbo']],
  Hockey:[['NHL','USA / Canada','hockey'],['KHL','Eurasia','khl'],['IIHF World Championship','International','iihf']],
  Cricket:[['IPL','India','ipl'],['Big Bash League','Australia','bigbash'],['ICC Cricket World Cup','International','cricket_world_cup']],
  Volleyball:[['FIVB Women','International','volleyball_w'],['FIVB Men','International','volleyball_m'],['PVL','Philippines','pvl'],['V.League','Japan','vleague_jp']],
  Motorsport:[['Formula 1','International','f1'],['MotoGP','International','motogp'],['Formula E','International','formulae']],
  Boxing:[['Boxing','Worldwide','boxing'],['WBC','International','wbc'],['WBA','International','wba'],['IBF','International','ibf'],['WBO','International','wbo']],
  'Combat Sports':[['UFC','International','ufc'],['ONE Championship','Asia','one']],
  'American Football':[['NFL','United States','football'],['NCAA Football','United States','ncaaf']]
};

const sportAccents={
  Basketball:'#ff6b35',
  Football:'#19b86a',
  Tennis:'#d7ff3f',
  Baseball:'#3f8cff',
  Hockey:'#68d8ff',
  Cricket:'#a777ff',
  Volleyball:'#ff4d8d',
  Motorsport:'#ff3b30',
  Boxing:'#f0b429',
  'Combat Sports':'#e4572e',
  'American Football':'#7b8cff'
};
let activeSport='Basketball';

const staticLeagueLogos={
  bleague:'https://commons.wikimedia.org/wiki/Special:Redirect/file/B.League_logo.svg',
  euroleague:'https://commons.wikimedia.org/wiki/Special:Redirect/file/EuroLeague_logo.svg',
  australian_open:'https://commons.wikimedia.org/wiki/Special:Redirect/file/AO26_logo.svg',
  wimbledon:'https://commons.wikimedia.org/wiki/Special:Redirect/file/WB-Logo.png',
  us_open:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Usopen-header-logo.svg',
  npb:'https://commons.wikimedia.org/wiki/Special:Redirect/file/NPB_logo.svg',
  kbo:'https://www.google.com/s2/favicons?domain=koreabaseball.com&sz=128',
  khl:'https://www.google.com/s2/favicons?domain=khl.ru&sz=128',
  iihf:'https://commons.wikimedia.org/wiki/Special:Redirect/file/IIHF_text_logo.svg',
  bigbash:'https://commons.wikimedia.org/wiki/Special:Redirect/file/BBL.svg',
  cricket_world_cup:'https://commons.wikimedia.org/wiki/Special:Redirect/file/ICC_Men%E2%80%99s_Cricket_World_Cup_logo.svg',
  pvl:'https://www.google.com/s2/favicons?domain=pvl.ph&sz=128',
  vleague_jp:'https://commons.wikimedia.org/wiki/Special:Redirect/file/V.League_Japan_logo.png',
  motogp:'https://commons.wikimedia.org/wiki/Special:Redirect/file/MotoGP_Logo_2026.png',
  formulae:'https://commons.wikimedia.org/wiki/Special:Redirect/file/FIA_Formula_E_World_Championship_Logo.svg',
  wbc:'https://www.google.com/s2/favicons?domain=wbcboxing.com&sz=128',
  wba:'https://www.google.com/s2/favicons?domain=wbaboxing.com&sz=128',
  ibf:'https://www.google.com/s2/favicons?domain=ibf-usba-boxing.com&sz=128',
  wbo:'https://www.google.com/s2/favicons?domain=wboboxing.com&sz=128',
  one:'https://commons.wikimedia.org/wiki/Special:Redirect/file/ONE_Championship.png',
  pfl:'https://www.google.com/s2/favicons?domain=pfl.org.ph&sz=128'
};

const logoFeeds={
  soccer:'https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard',
  laliga:'https://site.api.espn.com/apis/site/v2/sports/soccer/esp.1/scoreboard',
  seriea:'https://site.api.espn.com/apis/site/v2/sports/soccer/ita.1/scoreboard',
  bundesliga:'https://site.api.espn.com/apis/site/v2/sports/soccer/ger.1/scoreboard',
  champions:'https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/scoreboard',
  mls:'https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/scoreboard',
  basketball:'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard',
  wnba:'https://site.api.espn.com/apis/site/v2/sports/basketball/wnba/scoreboard',
  atp:'https://site.api.espn.com/apis/site/v2/sports/tennis/atp/scoreboard',
  wta:'https://site.api.espn.com/apis/site/v2/sports/tennis/wta/scoreboard',
  ipl:'https://site.api.espn.com/apis/site/v2/sports/cricket/ipl/scoreboard',
  volleyball_w:'https://site.api.espn.com/apis/site/v2/sports/volleyball/fivb.w/scoreboard',
  volleyball_m:'https://site.api.espn.com/apis/site/v2/sports/volleyball/fivb.m/scoreboard',
  f1:'https://site.api.espn.com/apis/site/v2/sports/racing/f1/scoreboard',
  ufc:'https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard',
  baseball:'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard',
  hockey:'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard',
  football:'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard',
  ncaaf:'https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard'
};
const scoreKeys=new Set(['soccer','laliga','seriea','bundesliga','champions','mls','basketball','wnba','pba','ncaa_ph','uaap','mpbl','nbl','nblaus','vba','atp','wta','ipl','volleyball_w','volleyball_m','baseball','hockey','football','ncaaf','f1','ufc','boxing']);
const oddsKeys=new Set(['soccer','laliga','seriea','bundesliga','champions','mls','basketball','wnba','baseball','hockey','football','ncaaf']);
let statsKeys=new Set();
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function fallbackLogo(name){
  const short=name.replace(/[^A-Za-z0-9 ]/g,' ').split(/\s+/).filter(Boolean).map(x=>x[0]).join('').slice(0,4).toUpperCase();
  return '<span class="sports-league-fallback">'+esc(short||name.slice(0,3).toUpperCase())+'</span>';
}
function leagueLogo(name,key){
  const supplied=key&&(window.IMG_SCORE_LEAGUE_LOGOS?.[key]||staticLeagueLogos[key]);
  if(!supplied)return fallbackLogo(name);
  return '<img class="sports-league-logo" src="'+esc(supplied)+'" alt="'+esc(name)+' logo" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'">'+fallbackLogo(name);
}
function capabilityBadges(key){
  if(!key)return '';
  const items=[];
  if(scoreKeys.has(key))items.push('<span class="cap-scores">Scores</span>');
  if(statsKeys.has(key))items.push('<span class="cap-stats">Stats</span>');
  if(oddsKeys.has(key))items.push('<span class="cap-odds">Odds</span>');
  return items.length?'<div class="sports-capabilities">'+items.join('')+'</div>':'';
}
function renderSports(){
  const names=Object.keys(sportsDirectory);
  document.getElementById('sportsCount').textContent=names.length+' sports';
  if(!sportsDirectory[activeSport])activeSport=names[0];

  document.getElementById('sportTabs').innerHTML=names.map((sport,index)=>{
    const selected=sport===activeSport;
    const accent=sportAccents[sport]||'#ef3f45';
    return '<button class="sports-tab'+(selected?' is-active':'')+'" type="button" role="tab" aria-selected="'+String(selected)+'" data-sport-tab="'+esc(sport)+'" style="--sport-accent:'+accent+';--tab-index:'+index+'">'+
      '<span>'+esc(sport)+'</span><small>'+sportsDirectory[sport].length+'</small>'+
    '</button>';
  }).join('');

  const leagues=sportsDirectory[activeSport]||[];
  const accent=sportAccents[activeSport]||'#ef3f45';
  document.getElementById('sportPanel').style.setProperty('--sport-accent',accent);
  document.getElementById('sportPanel').innerHTML=
    '<div class="sports-stage-head">'+
      '<div><span class="sports-stage-kicker">Selected sport</span><h2>'+esc(activeSport)+'</h2></div>'+
      '<strong>'+leagues.length+' competitions</strong>'+
    '</div>'+
    '<div class="sports-logo-grid">'+leagues.map((league,i)=>{const [name,region,key]=league;return (
      '<article class="sports-logo-tile" style="--league-index:'+i+';--sport-accent:'+accent+'" data-league-key="'+esc(key||'')+'">'+
        '<div class="sports-logo-mark" data-logo-host="'+esc(key||'')+'">'+leagueLogo(name,key)+'</div>'+
        '<div class="sports-logo-copy"><strong>'+esc(name)+'</strong><small>'+esc(region)+'</small>'+capabilityBadges(key)+'</div>'+
      '</article>'
    )}).join('')+'</div>';
}
async function loadStatsAvailability(){
  try{
    const r=await fetch('stats-data.json?v='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const j=await r.json();
    statsKeys=new Set(Object.keys(j?.leagues||{}));
    renderSports();
    hydrateLogos();
  }catch{}
}
async function hydrateLogo(key,url){
  if(!key||!url||window.IMG_SCORE_LEAGUE_LOGOS?.[key]||staticLeagueLogos[key])return;
  try{
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok)return;
    const j=await r.json();
    const league=j?.leagues?.[0]||{};
    const logos=Array.isArray(league.logos)?league.logos:[];
    const logo=logos.find(x=>/light|default/i.test(String(x?.rel||'')))?.href||logos[0]?.href||league.logo||'';
    if(!logo)return;
    document.querySelectorAll('[data-logo-host="'+CSS.escape(key)+'"]').forEach(host=>{
      if(host.querySelector('img'))return;
      const fallback=host.querySelector('.sports-league-fallback');
      const img=document.createElement('img');
      img.className='sports-league-logo';
      img.src=logo;
      img.alt=(host.closest('.sports-logo-tile')?.querySelector('strong')?.textContent||key)+' logo';
      img.loading='lazy';
      img.decoding='async';
      img.referrerPolicy='no-referrer';
      img.onerror=()=>img.remove();
      host.insertBefore(img,fallback||null);
    });
  }catch{}
}
function hydrateLogos(){Object.entries(logoFeeds).forEach(([key,url])=>void hydrateLogo(key,url))}
document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-sport-tab]');
  if(!btn)return;
  const next=btn.dataset.sportTab;
  if(!next||next===activeSport)return;
  activeSport=next;
  renderSports();
  hydrateLogos();
  requestAnimationFrame(()=>{
    const selected=document.querySelector('.sports-tab.is-active');
    selected?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  });
});
renderSports();
hydrateLogos();
loadStatsAvailability();
</script></body></html>
