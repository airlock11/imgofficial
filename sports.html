<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sports — IMG</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="mobile-nav.css?v=20260920-5"></head><body>
<header><nav class="shell"><a class="logo" href="index.html?v=20260920-5"><img src="img-logo-hq.png" alt="IMG"></a><div class="navlinks"><a href="index.html?v=20260920-5">Home</a><a class="active" href="sports.html">Sports</a><a href="scores.html">Scores</a><a href="news.html">News</a><a href="odds.html">Odds</a></div></nav></header>
<main><section class="content"><div class="shell"><div class="searchbox"><input id="sportSearch" type="search" placeholder="Search sports or leagues"><button id="clearSearch">Clear</button></div><div id="resultCount" class="result-count"></div><div id="sportList" class="sport-list"></div></div></section></main>
<dialog id="sportModal"><div class="modalhead"><h2>Sport</h2><button class="close" aria-label="Close league list">×</button></div><div class="modalbody"></div></dialog>
<div class="bottomnav"><a href="index.html?v=20260920-5"><b><span class="navglyph icon-home" aria-hidden="true"></span></b>Home</a><a class="active" href="sports.html"><b><span class="navglyph icon-sports" aria-hidden="true"></span></b>Sports</a><a href="scores.html"><b><span class="navglyph icon-scores" aria-hidden="true"></span></b>Scores</a><a href="news.html"><b><span class="navglyph icon-news" aria-hidden="true"></span></b>News</a><a href="odds.html"><b><span class="navglyph icon-odds" aria-hidden="true"></span></b>Odds</a></div><script src="app.js"></script><script>const names=Object.keys(leagues);function draw(q=''){const low=q.toLowerCase();const list=names.filter(n=>n.toLowerCase().includes(low)||(leagues[n]||[]).some(x=>x[0].toLowerCase().includes(low)));sportList.innerHTML=list.map(n=>'<button class="sport-row" data-sport="'+n+'"><div><strong>'+n+'</strong><small>'+leagues[n].length+' competitions</small></div><span>→</span></button>').join('');resultCount.textContent=list.length+' sports shown'}draw();sportSearch.oninput=e=>draw(e.target.value);clearSearch.onclick=()=>{sportSearch.value='';draw();sportSearch.focus()}</script></body></html>
